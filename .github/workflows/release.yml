name: release
# A release that any Mac opens as downloaded: MacStats.app built on a macOS runner, signed with
# the Developer ID, notarized, zipped, and published with the tag. Started by hand only (Cyrus,
# 2026-10-13: nothing runs that nobody asked for). Secrets: APPLE_CERT_P12 (base64 of a .p12
# holding the "Developer ID Application" identity and Apple's Developer ID G2 intermediate),
# APPLE_CERT_PASSWORD, APPLE_API_KEY (the App Store Connect API key, .p8, base64),
# APPLE_API_KEY_ID, APPLE_API_ISSUER, and HOMEBREW_TAP_DEPLOY_KEY (the private half of a deploy key
# that can write to csarkosh/homebrew-tap alone, for the cask).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.1.0 (VERSION is bumped, committed and tagged)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "run this workflow on main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not major.minor.patch"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$VERSION" && { echo "tag exists"; exit 1; } || true
      - name: Bump the version and tag
        run: |
          printf '%s\n' "$VERSION" > VERSION
          git config user.name "release workflow"
          git config user.email "release@csarko.sh"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
      - name: Signing identity
        # A keychain of its own for the run, the identity imported into it, and codesign allowed
        # to use the key without a prompt. The runner is thrown away afterwards.
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/identity.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "no valid Developer ID Application identity in the imported .p12"; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign, notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          make app
          test "$(build/MacStats.app/Contents/MacOS/MacStats --version)" = "$VERSION"
          ZIP="build/MacStats-$VERSION-arm64.zip"
          ditto -c -k --keepParent build/MacStats.app "$ZIP"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" sh scripts/notarize.sh "$ZIP"
          rm -f "$RUNNER_TEMP/notary.p8"
          spctl -a -t exec -vv build/MacStats.app 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          shasum -a 256 "$ZIP" | tee build/MacStats-$VERSION-arm64.zip.sha256
      - name: Record the release in the cask
        # The cask's version and the notarized zip's sha256, committed after the tagged release
        # commit and pushed with it, so homebrew/macstats.rb always names the latest release.
        run: |
          sh scripts/cask.sh "$VERSION" "build/MacStats-$VERSION-arm64.zip"
          git commit -qm "Cask: macstats $VERSION" homebrew/macstats.rb
      - name: Push the release commit and tag
        # Both or neither: a tag without its commit on main (or the reverse) is never published.
        run: git push --atomic origin HEAD:main "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commits since the last release, without the release commit or the cask's records.
          PREV=$(git describe --tags --abbrev=0 "v$VERSION~1" 2>/dev/null || true)
          if [ -n "$PREV" ]; then NOTES=$(git log --format='- %s' --invert-grep --grep='^Cask: macstats ' "$PREV..v$VERSION~1"); else NOTES="First release."; fi
          gh release create "v$VERSION" build/MacStats-*.zip build/MacStats-*.zip.sha256 --title "MacStats $VERSION" --notes "$NOTES"
      - name: Publish the Homebrew cask
        # After the release, since the cask points at its zip. The deploy key can write to the tap
        # alone, and GitHub's host keys come from its API rather than a first connection's word.
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set: the release is out, but the cask still names the last one. Add the key (AGENTS.md, Releasing) or run 'sh scripts/tap.sh $VERSION' from main."
            exit 1
          fi
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          sh scripts/tap.sh "$VERSION"
          rm -f "$RUNNER_TEMP/tap_key"
